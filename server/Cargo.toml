[package]
name = "flacora-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Headless Flacora engine with a web UI, for Docker."
publish = false

[dependencies]
flacora = { path = ".." }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tower-http = { version = "0.6", features = ["fs", "cors", "limit"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
